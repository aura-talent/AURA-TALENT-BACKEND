name: Deploy to GCP VM

on:
  push:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to GCP
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get VM IP
        id: get-ip
        run: |
          # Use the current VM IP
          echo "vm_ip=34.132.193.54" >> $GITHUB_OUTPUT

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key
          ssh-keyscan -H 34.132.193.54 >> ~/.ssh/known_hosts

      - name: Sync Vertex AI & Scraper credentials
        env:
          VM_IP: ${{ steps.get-ip.outputs.vm_ip }}
          VERTEX_AI_KEY_JSON: ${{ secrets.VERTEX_AI_KEY_JSON }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          echo "$VERTEX_AI_KEY_JSON" > /tmp/vertex-ai-agent-key.json
          scp -i ~/.ssh/gcp_key -o StrictHostKeyChecking=no /tmp/vertex-ai-agent-key.json github-actions@$VM_IP:/opt/career-ops-backend/vertex-ai-agent-key.json
          rm -f /tmp/vertex-ai-agent-key.json

          ssh -i ~/.ssh/gcp_key -o StrictHostKeyChecking=no github-actions@$VM_IP << ENDSSH
            set -e
            cd /opt/career-ops-backend
            chmod 600 vertex-ai-agent-key.json
            touch .env

            # GOOGLE_CLOUD_LOCATION is not read by google-cloud-aiplatform (it
            # reads GOOGLE_CLOUD_REGION) - drop any stale copy so it can't
            # shadow the correct var.
            sed -i '/^GOOGLE_CLOUD_LOCATION=/d' .env

            if grep -q '^GOOGLE_CLOUD_REGION=' .env; then
              sed -i 's/^GOOGLE_CLOUD_REGION=.*/GOOGLE_CLOUD_REGION=global/' .env
            else
              echo 'GOOGLE_CLOUD_REGION=global' >> .env
            fi

            if grep -q '^GOOGLE_APPLICATION_CREDENTIALS=' .env; then
              sed -i 's|^GOOGLE_APPLICATION_CREDENTIALS=.*|GOOGLE_APPLICATION_CREDENTIALS=vertex-ai-agent-key.json|' .env
            else
              echo 'GOOGLE_APPLICATION_CREDENTIALS=vertex-ai-agent-key.json' >> .env
            fi

            if grep -q '^MODEL_NAME=' .env; then
              sed -i 's|^MODEL_NAME=.*|MODEL_NAME=google_vertexai:gemini-3.5-flash|' .env
            else
              echo 'MODEL_NAME=google_vertexai:gemini-3.5-flash' >> .env
            fi

            if [ -n "$SCRAPER_API_KEY" ]; then
              if grep -q '^SCRAPER_API_KEY=' .env; then
                sed -i "s|^SCRAPER_API_KEY=.*|SCRAPER_API_KEY=$SCRAPER_API_KEY|" .env
              else
                echo "SCRAPER_API_KEY=$SCRAPER_API_KEY" >> .env
              fi
            fi
ENDSSH


      - name: Deploy to VM
        env:
          VM_IP: ${{ steps.get-ip.outputs.vm_ip }}
        run: |
          # Deploy to VM
          ssh -i ~/.ssh/gcp_key -o StrictHostKeyChecking=no github-actions@$VM_IP << 'ENDSSH'
            set -e
            
            # Navigate to app directory
            cd /opt/career-ops-backend
            
            # Configure git if needed
            if [ ! -d ".git" ]; then
              echo "Git directory not found, cloning repository..."
              cd /opt
              sudo rm -rf career-ops-backend
              sudo mkdir -p career-ops-backend
              sudo chown github-actions:github-actions career-ops-backend
              cd career-ops-backend
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            # Pull latest code
            cd /opt/career-ops-backend
            git fetch origin main
            git reset --hard origin/main
            
            # Install/update dependencies
            ~/.local/bin/uv sync
            
            # Restart the service
            sudo systemctl restart career-ops-backend
            
            # Wait for service to be ready
            echo "Waiting for service to start..."
            sleep 5
            
            # Check if service is running
            if sudo systemctl is-active --quiet career-ops-backend; then
              echo "✓ Deployment successful!"
              sudo systemctl status career-ops-backend --no-pager
            else
              echo "✗ Deployment failed - service not running"
              sudo journalctl -u career-ops-backend -n 20 --no-pager
              exit 1
            fi
          ENDSSH

      - name: Health Check
        env:
          VM_IP: ${{ steps.get-ip.outputs.vm_ip }}
        run: |
          echo "Running health check..."
          max_attempts=10
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts"
            if curl -f -s http://$VM_IP:8000/health > /dev/null; then
              echo "✓ Health check passed!"
              curl -s http://$VM_IP:8000/health
              exit 0
            fi
            echo "Service not ready yet, waiting..."
            sleep 3
            attempt=$((attempt + 1))
          done
          
          echo "✗ Health check failed after $max_attempts attempts"
          exit 1

      - name: Deployment Summary
        if: success()
        run: |
          echo "### ✅ Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API Endpoint:** http://${{ steps.get-ip.outputs.vm_ip }}:8000" >> $GITHUB_STEP_SUMMARY
          echo "**Docs:** http://${{ steps.get-ip.outputs.vm_ip }}:8000/docs" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
